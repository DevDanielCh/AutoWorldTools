# =======================================
#  AutoWorldTools
# =======================================
#
#  Regeneração e backup automático de mundos.
#
# @author     rypengu23
# @copyright  Copyright ryoengu23 2021
version: 1.9
# =======================================

setting:
  # Idioma das mensagens no chat (en/ja)
  # en:English
  # ja:日本語
  language: "en"

  # Idioma das mensagens no console (en/ja)
  # en:English
  # ja:日本語
  consoleLanguage: "en"

  # Se deve resetar os mundos automaticamente no horário definido. (true/false)
  autoReset: true

  # Se deve fazer backup dos mundos automaticamente no horário definido. (true/false)
  autoBackup: true

  # Se deve reiniciar o servidor automaticamente no horário definido. (true/false)
  autoRestart: true

  # Se deve enviar mensagem no canal principal do DiscordSRV ao iniciar/concluir
  # o reset, o backup ou o reinício.
  useDiscordSRV: false

  # Quantidade máxima de backups mantidos por mundo.
  # Os arquivos mais antigos são removidos automaticamente.
  backupLimit: 30

# =======================================
#  Configuração do reset
# =======================================

resetTime:
  # Dia da semana do reset automático. (sun,mon,tue,wed,thu,fri,sat)
  # Para informar mais de um dia, separe por vírgula. (,)
  resetDayOfTheWeek: "sun"

  # Horário do reset (hh:mm)
  # Para informar mais de um horário, separe por vírgula. (,)
  resetTime: "00:00"

  # Avisos antes do reset, em segundos.
  # Para informar mais de um, separe por vírgula. (,)
  # Deixe em branco se não quiser avisos.
  resetNotifyTime: "300,60,30,10,5,4,3,2,1"

resetWorldInfo:
  # Nome dos mundos que serão resetados.
  # Para fixar a seed após o reset, acrescente ":" e o valor depois do nome do mundo.
  # Exemplo) material:0123456789
  # Para informar mais de um mundo, separe por vírgula. (,)
  # Atenção: o conteúdo dos mundos listados aqui será apagado.

  # Overworld (normal)
  worldNameOfNormal: "material,material2:0123456789"
  # Nether
  worldNameOfNether: "material_nether"
  # The End
  worldNameOfEnd: "material_the_end"

border:
  # Tamanho da borda do mundo após o reset (diâmetro)

  # Overworld (normal)
  worldOfNormalSize: 2000
  # Nether
  worldOfNetherSize: 2000
  # The End
  worldOfEndSize: 6000

gateInfo:
  # Se você utiliza o Multiverse-Portals. (true/false)
  useMultiversePortals: false

  # Se você utiliza o Multiverse-Portals, informe o nome do portal usado em cada mundo.
  # A quantidade de nomes deve ser igual à quantidade de mundos em resetWorldInfo.

  # Nome do portal (Overworld/normal)
  portalNameOfNormal: "material_spawn"
  # Nome do portal (Nether)
  portalNameOfNether: "materialnether_spawn"
  # Nome do portal (The End)
  portalNameOfEnd: "materialend_spawn"

  # Se você utiliza o Multiverse-Portals, se deve gerar a estrutura (gate)
  # ao redor do portal do mundo indicado. (true/false)

  # Overworld (normal)
  gateAutoBuildOfNormal: true
  # Nether
  gateAutoBuildOfNether: true
  # The End
  gateAutoBuildOfEnd: true

dynmap:

  # Se você utiliza o Dynmap, se deve apagar as imagens renderizadas no reset.
  useDynmap: false

  # Se deve apagar o mapa dos mundos (Overworld) que serão resetados.
  mapPurgeAtResetOfNormal: false
  # Se deve apagar o mapa dos mundos (Nether) que serão resetados.
  mapPurgeAtResetOfNether: false
  # Se deve apagar o mapa dos mundos (The End) que serão resetados.
  mapPurgeAtResetOfEnd: false

  # Se quiser apagar o mapa de mundo específico no reset,
  # informe o nome do mundo que deseja apagar.
  mapPurgeAtResetWorldName: "world_test"

# =======================================
#  Configuração do backup
# =======================================

backupWorldInfo:
  # Nome dos mundos que serão salvos em backup.
  # Para informar mais de um mundo, separe por vírgula. (,)
  backupWorldName: "world,world_nether"

backupTime:
  # Dia da semana do backup automático. (sun,mon,tue,wed,thu,fri,sat)
  # Para informar mais de um dia, separe por vírgula. (,)
  backupDayOfTheWeek: "sun"

  # Horário do backup (hh:mm)
  # Para informar mais de um horário, separe por vírgula. (,)
  backupTime: "00:00"

  # Avisos antes do backup, em segundos.
  # Para informar mais de um, separe por vírgula. (,)
  # Deixe em branco se não quiser avisos.
  backupNotifyTime: "300,60,30,10,5,4,3,2,1"

backupLocation:

  # Pasta de destino dos backups.
  # Use "/" como separador, também no Windows (ex.: "C:/worldBackup/").
  fileLocation: "C:/worldBackup/"

# =======================================
#  Configuração do reinício
# =======================================

restartTime:
  # Dia da semana do reinício automático. (sun,mon,tue,wed,thu,fri,sat)
  # Para informar mais de um dia, separe por vírgula. (,)
  restartDayOfTheWeek: "sun"

  # Horário do reinício (hh:mm)
  # Para informar mais de um horário, separe por vírgula. (,)
  restartTime: "00:00"

  # Avisos antes do reinício, em segundos.
  # Para informar mais de um, separe por vírgula. (,)
  # Deixe em branco se não quiser avisos.
  restartNotifyTime: "300,60,30,10,5,4,3,2,1"